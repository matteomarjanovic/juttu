<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to Juttu</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    background: #f7f9f9;
    color: #0f1419;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border: 1px solid #e1e8ed;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.25rem;
    font-weight: 700;
  }
  .subtitle {
    margin: 0 0 1.5rem;
    color: #536471;
    font-size: 0.875rem;
  }
  .btn-bsky {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    background: #1d9bf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 0.9375rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-bsky:hover:not(:disabled) { opacity: 0.88; }
  .btn-bsky:disabled { opacity: 0.5; cursor: not-allowed; }
  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.25rem 0;
    color: #536471;
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e1e8ed;
  }
  .custom-pds {
    font-size: 0.8rem;
    color: #536471;
    margin-bottom: 0.5rem;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid #e1e8ed;
    border-radius: 8px;
    padding: 0.45rem 0.75rem;
    font-family: inherit;
    font-size: 0.875rem;
    background: #f7f9f9;
    color: #0f1419;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { outline: none; border-color: #1d9bf0; }
  input[type="text"]::placeholder { color: #536471; }
  .btn-login {
    background: #1d9bf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.45rem 1rem;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-login:hover:not(:disabled) { opacity: 0.88; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: #c0392b;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in to Juttu</h1>
  <p class="subtitle">Authentication is required to post, like, or repost comments.</p>

  <button class="btn-bsky" id="bsky-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 501" width="18" height="18" fill="currentColor">
      <path d="M123.121 33.664C188.241 82.553 258.281 181.68 284 234.873c25.719-53.192 95.759-152.32 160.879-201.21C491.866-1.611 568-28.906 568 57.947c0 17.346-9.945 145.713-15.778 166.555-20.275 72.453-94.155 90.933-159.875 79.748C507.222 323.8 536.444 388.56 473.333 453.32c-119.86 122.992-172.272-30.859-185.702-70.281-2.462-7.227-3.614-10.608-3.631-7.733-.017-2.875-1.169.506-3.631 7.733-13.43 39.422-65.842 193.273-185.702 70.281-63.111-64.76-33.89-129.52 80.986-149.071-65.72 11.185-139.6-7.295-159.875-79.748C9.945 203.659 0 75.291 0 57.946 0-28.906 76.135-1.612 123.121 33.664Z"/>
    </svg>
    Login with Bluesky
  </button>

  <div class="divider">or use a custom PDS</div>

  <p class="custom-pds">Enter your Bluesky handle</p>
  <div class="input-row">
    <input type="text" id="handle-input" placeholder="yourhandle.bsky.social" autocomplete="username" />
    <button class="btn-login" id="handle-btn">Login</button>
  </div>

  <p class="error" id="error-msg"></p>
</div>

<script>
  var bskyBtn = document.getElementById('bsky-btn');
  var handleInput = document.getElementById('handle-input');
  var handleBtn = document.getElementById('handle-btn');
  var errorMsg = document.getElementById('error-msg');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function clearError() {
    errorMsg.classList.remove('visible');
  }

  function setLoading(loading) {
    bskyBtn.disabled = loading;
    handleBtn.disabled = loading;
  }

  async function startLogin(handle) {
    clearError();
    setLoading(true);
    try {
      var res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ handle: handle })
      });
      var data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Login failed (' + res.status + ')');
      }
      window.location.href = data.redirect_url;
    } catch (err) {
      setLoading(false);
      showError(err.message || 'Login failed');
    }
  }

  bskyBtn.addEventListener('click', function() {
    startLogin('https://bsky.social');
  });

  handleBtn.addEventListener('click', function() {
    var handle = handleInput.value.trim().replace(/^@/, '');
    if (!handle) { handleInput.focus(); return; }
    startLogin(handle);
  });

  handleInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var handle = handleInput.value.trim().replace(/^@/, '');
      if (!handle) return;
      startLogin(handle);
    }
  });
</script>
</body>
</html>
