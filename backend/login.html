<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to Juttu</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    background: #f7f9f9;
    color: #0f1419;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border: 1px solid #e1e8ed;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    display: flex;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .logo svg {
    height: 34px;
    width: auto;
    color: #0f1419;
  }
  .subtitle {
    margin: 0 0 1.5rem;
    color: #536471;
    font-size: 0.875rem;
    text-align: center;
  }
  .providers {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .btn-provider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    background: #fff;
    color: #0f1419;
    text-decoration: none;
    border: 1px solid #cfd9de;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 0.9375rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-provider:hover:not(:disabled) { background: #f7f9f9; border-color: #1d9bf0; }
  .btn-provider:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-provider svg { width: 20px; height: 20px; flex-shrink: 0; }
  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.25rem 0;
    color: #536471;
    font-size: 0.8rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e1e8ed;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
  }
  .handle-wrap {
    position: relative;
    flex: 1;
  }
  input[type="text"] {
    width: 100%;
    border: 1px solid #e1e8ed;
    border-radius: 8px;
    padding: 0.45rem 0.75rem;
    font-family: inherit;
    font-size: 0.875rem;
    background: #f7f9f9;
    color: #0f1419;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { outline: none; border-color: #1d9bf0; }
  input[type="text"]::placeholder { color: #536471; }
  .suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    margin: 0.25rem 0 0;
    padding: 0;
    list-style: none;
    background: #fff;
    border: 1px solid #e1e8ed;
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }
  .suggestions button {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    text-align: left;
    color: #0f1419;
  }
  .suggestions button:hover,
  .suggestions button.active { background: #f0f3f5; }
  .suggestions .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #e1e8ed;
    object-fit: cover;
  }
  .suggestions .s-handle { font-weight: 600; }
  .suggestions .s-name {
    color: #536471;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-login {
    background: #1d9bf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.45rem 1rem;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-login:hover:not(:disabled) { opacity: 0.88; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .signup {
    margin: 1.25rem 0 0;
    text-align: center;
    font-size: 0.8rem;
    color: #536471;
  }
  .signup a { color: #1d9bf0; text-decoration: none; }
  .signup a:hover { text-decoration: underline; }
  .error {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: #c0392b;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

  </div>
  <div id="login-view">
  <p class="subtitle">Sign in with your Atmosphere account to like, repost, or reply.</p>

  <div class="providers">
    <button class="btn-provider" data-pds="https://bsky.social">

  </div>

  <div class="divider">or use your handle</div>

  <div class="input-row">
    <div class="handle-wrap">
      <input type="text" id="handle-input" placeholder="yourhandle.bsky.social" autocomplete="off" spellcheck="false" />
      <ul class="suggestions" id="handle-suggestions" hidden></ul>
    </div>
    <button class="btn-login" id="handle-btn">Login</button>
  </div>

  <p class="signup">
    New to the Atmosphere? <a id="show-signup" href="#">Create an account</a>
  </p>

  <p class="error" id="error-msg"></p>
  </div>

  <div id="signup-view" hidden>
    <p class="subtitle">Choose a provider to create your Atmosphere account.</p>
    <div class="providers" id="signup-providers"></div>
    <p class="signup"><a id="show-login" href="#">&larr; Back to sign in</a></p>
  </div>
</div>

<script>
  var handleInput = document.getElementById('handle-input');
  var handleBtn = document.getElementById('handle-btn');
  var errorMsg = document.getElementById('error-msg');
  var providerBtns = document.querySelectorAll('.btn-provider');
  var suggestionsEl = document.getElementById('handle-suggestions');

  // This page only collects a reader's handle/provider now; owner setup is driven directly by
  // the widget (it POSTs /auth/login and navigates the popup itself).
  var pageIntent = new URLSearchParams(location.search).get('intent') === 'setup' ? 'setup' : 'comment';

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function clearError() {
    errorMsg.classList.remove('visible');
  }

  function setLoading(loading) {
    handleBtn.disabled = loading;
    document.querySelectorAll('.btn-provider').forEach(function (b) { b.disabled = loading; });
  }

  async function startLogin(handle) {
    clearError();
    setLoading(true);
    try {
      var res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ handle: handle, intent: pageIntent })
      });
      var data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Login failed (' + res.status + ')');
      }
      window.location.href = data.redirect_url;
    } catch (err) {
      setLoading(false);
      showError(err.message || 'Login failed');
    }
  }

  providerBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { startLogin(btn.getAttribute('data-pds')); });
  });

  // ── Create-account view ──────────────────────────────────────────────────────
  // The provider's OAuth page offers sign-up as well as sign-in, so these buttons run the
  // exact same flow as the login buttons — just framed for new accounts.
  var loginView = document.getElementById('login-view');
  var signupView = document.getElementById('signup-view');
  var signupProviders = document.getElementById('signup-providers');
  var PROVIDER_LABELS = {
    'https://bsky.social': 'Bluesky',
    'https://eurosky.social': 'Eurosky',
    'https://blacksky.app': 'Blacksky'
  };

  providerBtns.forEach(function (btn) {
    var pds = btn.getAttribute('data-pds');
    var label = PROVIDER_LABELS[pds];
    if (!label) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-provider';
    b.appendChild(btn.querySelector('svg').cloneNode(true));
    b.appendChild(document.createTextNode('Sign up with ' + label));
    b.addEventListener('click', function () { startLogin(pds); });
    signupProviders.appendChild(b);
  });

  document.getElementById('show-signup').addEventListener('click', function (e) {
    e.preventDefault();
    loginView.hidden = true;
    signupView.hidden = false;
  });
  document.getElementById('show-login').addEventListener('click', function (e) {
    e.preventDefault();
    signupView.hidden = true;
    loginView.hidden = false;
  });

  // ── Handle typeahead (Atmosphere account search) ─────────────────────────────
  var debounceTimer;
  var activeIndex = -1;
  var currentSuggestions = [];

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function closeSuggestions() {
    suggestionsEl.hidden = true;
    suggestionsEl.innerHTML = '';
    currentSuggestions = [];
    activeIndex = -1;
  }

  function setActive(i) {
    var items = suggestionsEl.querySelectorAll('button');
    items.forEach(function (b, idx) { b.classList.toggle('active', idx === i); });
    activeIndex = i;
  }

  function selectSuggestion(actor) {
    handleInput.value = actor.handle;
    closeSuggestions();
  }

  function renderSuggestions(actors) {
    currentSuggestions = actors;
    activeIndex = -1;
    if (!actors.length) { closeSuggestions(); return; }
    suggestionsEl.innerHTML = '';
    actors.forEach(function (actor) {
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.type = 'button';
      var avatar = actor.avatar
        ? '<img class="avatar" src="' + escapeHtml(actor.avatar) + '" alt="">'
        : '<span class="avatar"></span>';
      var name = actor.displayName && actor.displayName !== actor.handle
        ? '<span class="s-name">' + escapeHtml(actor.displayName) + '</span>' : '';
      btn.innerHTML = avatar + '<span class="s-handle">@' + escapeHtml(actor.handle) + '</span>' + name;
      btn.addEventListener('mousedown', function (e) { e.preventDefault(); selectSuggestion(actor); });
      li.appendChild(btn);
      suggestionsEl.appendChild(li);
    });
    suggestionsEl.hidden = false;
  }

  async function fetchSuggestions(q) {
    if (q.length < 2) { closeSuggestions(); return; }
    try {
      var res = await fetch('https://public.api.bsky.app/xrpc/app.bsky.actor.searchActorsTypeahead?q=' + encodeURIComponent(q) + '&limit=6');
      if (!res.ok) return;
      var data = await res.json();
      renderSuggestions(data.actors || []);
    } catch (e) {
      // ignore network errors
    }
  }

  handleInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    var q = handleInput.value.trim().replace(/^@/, '');
    debounceTimer = setTimeout(function () { fetchSuggestions(q); }, 250);
  });

  handleInput.addEventListener('blur', function () {
    setTimeout(closeSuggestions, 150);
  });

  handleInput.addEventListener('keydown', function (e) {
    if (!suggestionsEl.hidden && currentSuggestions.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIndex + 1, currentSuggestions.length - 1)); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0)); return; }
      if (e.key === 'Escape') { closeSuggestions(); return; }
      if (e.key === 'Enter' && activeIndex >= 0) { e.preventDefault(); selectSuggestion(currentSuggestions[activeIndex]); return; }
    }
    if (e.key === 'Enter') {
      var handle = handleInput.value.trim().replace(/^@/, '');
      if (!handle) return;
      startLogin(handle);
    }
  });

  handleBtn.addEventListener('click', function () {
    var handle = handleInput.value.trim().replace(/^@/, '');
    if (!handle) { handleInput.focus(); return; }
    startLogin(handle);
  });
</script>
</body>
</html>
